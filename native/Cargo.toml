[package]
name = "kindling"
version = "0.7.0"
edition = "2021"
description = "Kindling (working name): a living-civilisation simulator where technology emerges from material physics (desktop + web front end)"
license = "MIT"
publish = false

[[bin]]
name = "kindling"
path = "src/main.rs"

[dependencies]
macroquad = { version = "0.4", default-features = false }
egui-macroquad = { version = "0.17", default-features = false }
serde_json = "1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
civ-core = { path = "../civ-core", features = ["parallel"] }
rayon = "1.10"
mimalloc = { version = "0.1", default-features = false }

[target.'cfg(target_arch = "wasm32")'.dependencies]
civ-core = { path = "../civ-core" }

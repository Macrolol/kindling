[package]
name = "civ-core"
version = "0.9.0"
edition = "2021"
description = "Deterministic engine of the Kindling civilisation simulator: generated world, materials physics, emergent invention, versioned saves"
license = "MIT"
publish = false

[features]
default = []
parallel = ["dep:rayon"]

[dependencies]
rayon = { version = "1.10", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rmp-serde = "1"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }

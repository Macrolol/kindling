# Headless multi-seed simulation runs for Kindling.
#
# Manual trigger only (workflow_dispatch). Intended for small, test-sized runs that
# check the simulator's own behaviour (regression / balance checks), in line with
# GitHub's terms for hosted runners. For long or large sweeps, register a self-hosted
# runner and pass its label in the `runner` input.
#
# Verified against the source tree (native/src/cli.rs):
#   package / binary: kindling   (cargo build --release -p kindling)
#   There is no `parallel` feature on `kindling`; native builds always enable
#   civ-core/parallel (rayon) via native/Cargo.toml, so no --features flag is passed.
#   headless:  kindling --headless --seeds A..B --years N [--map WxH] [--threads N]
#                       [--config params.json] [--save out.civsave]
#   screenshot (needs a window, run under Xvfb):
#              kindling --seed S --screenshot out.png --years N [--map WxH]
#   --config takes a JSON params file (Params::from_json_compat), not TOML.
#   --save writes after every seed, so this workflow runs one process per seed when
#   saves are requested, to keep one .civsave per seed.
#   archive (default on): an `archive` job packs every output (tar + zstd -19, plus a
#   run-manifest.json) into an asset of a public pre-release `run-<run id>` tagged at the
#   simulated commit (never latest; v0.x releases untouched). .civsave files only with
#   archive_saves. Only that job has contents: write. See docs/CI-ARCHIVES.md.
#   --out DIR writes structured outputs per seed (DIR/seed-S/manifest.json, metrics.csv,
#   summary.json, chronicle.ndjson, frames.ndjson; docs/DATA_SCHEMA.md). The summary job
#   aggregates those (tools/collect_runs.py, tools/agg_results.py) and still keeps the text
#   reports (results-*.txt, tools/sum_results.py).
name: headless-sims

on:
  workflow_dispatch:
    inputs:
      seeds:
        description: "Seed range A..B (inclusive), e.g. 1..10"
        required: true
        default: "1..10"
        type: string
      years:
        description: "Years to simulate per seed"
        required: true
        default: "500"
        type: string
      map:
        description: "Map size WxH, e.g. 160x100 (blank = default 256x160)"
        required: false
        default: ""
        type: string
      config:
        description: "Params JSON file path in the repo (blank = defaults)"
        required: false
        default: ""
        type: string
      ref:
        description: "Git ref to build (branch, tag or SHA; blank = default branch)"
        required: false
        default: ""
        type: string
      seeds_per_job:
        description: "Seeds per matrix job"
        required: true
        default: "5"
        type: string
      save_civsave:
        description: "Upload the final .civsave of each seed"
        required: false
        default: false
        type: boolean
      screenshots:
        description: "Also render a PNG per seed under Xvfb (re-runs each seed, about 2x cost)"
        required: false
        default: false
        type: boolean
      threads:
        description: "Worker threads per sim (--threads); hosted runners have 4 cores"
        required: false
        default: "4"
        type: string
      run_tests:
        description: "Also run cargo test on a separate runner (informational)"
        required: false
        default: true
        type: boolean
      baseline:
        description: "Results file in the repo to compare against in the summary (blank = none)"
        required: false
        default: "docs/results-v5-seeds1-10-500y.txt"
        type: string
      report:
        description: "Progress line (pop, bands, items) on stdout every K years (blank = default 50, 0 = off)"
        required: false
        default: ""
        type: string
      sim_timeout:
        description: "Minutes allowed per sim job (hosted runners stop at 360)"
        required: false
        default: "150"
        type: string
      archive:
        description: "Publish all outputs as one compressed archive on a public pre-release run-<run id> (docs/CI-ARCHIVES.md)"
        required: false
        default: true
        type: boolean
      archive_saves:
        description: "Include the .civsave files in that archive (needs save_civsave; CI-generated saves only)"
        required: false
        default: false
        type: boolean
      probe:
        description: "Also run the read-only diffusion probe on the same seeds and map (civ-core/src/probe_diffusion.rs, docs/PROGRESS-diffusion.md)"
        required: false
        default: false
        type: boolean
      runner:
        description: "runs-on label for build and sim jobs (e.g. a self-hosted runner label)"
        required: false
        default: "ubuntu-latest"
        type: string

permissions:
  contents: read

concurrency:
  # one queue per tested ref, so experiments on different commits run side by side
  # (a single group per branch serialised them, and a newer pending run cancelled an older one)
  group: headless-sims-${{ inputs.ref || github.sha }}-${{ inputs.seeds }}-${{ inputs.years }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: never
  SIM_THREADS: ${{ inputs.threads || '4' }}
  # Guard rails to keep hosted runs test-sized.
  MAX_SEEDS: "200"
  MAX_YEARS: "5000"

jobs:
  plan:
    name: Plan seed matrix
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      jobs: ${{ steps.plan.outputs.jobs }}
      sha: ${{ steps.ref.outputs.sha }}
    steps:
      # Resolve the ref once to a full commit SHA: actions/checkout cannot fetch a short SHA,
      # and every job then builds / reads exactly the same commit even if the branch moves.
      - name: Resolve ref
        id: ref
        env:
          GH_TOKEN: ${{ github.token }}
          REF: ${{ inputs.ref || github.sha }}
        run: |
          set -euo pipefail
          sha=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${REF}" -q .sha)
          echo "ref '${REF}' -> ${sha}"
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"

      - name: Split seeds into ranges
        id: plan
        env:
          SEEDS: ${{ inputs.seeds }}
          YEARS: ${{ inputs.years }}
          PER_JOB: ${{ inputs.seeds_per_job }}
          MAP: ${{ inputs.map }}
        run: |
          python3 - <<'PY'
          import json, os, re, sys
          def fail(msg):
              print(f"::error::{msg}")
              sys.exit(1)
          seeds = os.environ["SEEDS"].strip()
          m = re.fullmatch(r"(\d+)(?:\.\.(\d+))?", seeds)
          if not m:
              fail(f"seeds must look like A..B or A, got {seeds!r}")
          a = int(m.group(1)); b = int(m.group(2) or a)
          if b < a:
              fail("seeds: B must be >= A")
          if not re.fullmatch(r"\d+", os.environ["YEARS"].strip()):
              fail("years must be a positive integer")
          years = int(os.environ["YEARS"])
          if not 1 <= years <= int(os.environ["MAX_YEARS"]):
              fail(f"years must be 1..{os.environ['MAX_YEARS']}")
          mp = os.environ["MAP"].strip()
          if mp and not re.fullmatch(r"\d+x\d+", mp):
              fail("map must look like WxH, e.g. 160x100")
          if not re.fullmatch(r"\d+", os.environ["PER_JOB"].strip()) or int(os.environ["PER_JOB"]) < 1:
              fail("seeds_per_job must be a positive integer")
          k = int(os.environ["PER_JOB"])
          n = b - a + 1
          if n > int(os.environ["MAX_SEEDS"]):
              fail(f"{n} seeds requested; limit is {os.environ['MAX_SEEDS']} per run")
          chunks = [{"from": s, "to": min(s + k - 1, b), "name": f"{s}-{min(s + k - 1, b)}"}
                    for s in range(a, b + 1, k)]
          if len(chunks) > 256:
              fail(f"{len(chunks)} jobs; GitHub allows at most 256 per matrix, raise seeds_per_job")
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"matrix={json.dumps({'include': chunks})}\n")
              f.write(f"jobs={len(chunks)}\n")
          print(f"{n} seeds in {len(chunks)} jobs: {[c['name'] for c in chunks]}")
          PY

  build:
    name: Build kindling (release)
    needs: plan
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false

      # macroquad/miniquad are built with default-features = false and load X11/GL at
      # run time (dlopen), so no -dev packages are needed to compile on Linux.
      - name: Install Rust (stable)
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustc --version && cargo --version

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Build
        run: cargo build --release --locked -p kindling

      - name: Smoke test CLI
        run: ./target/release/kindling --help

      - uses: actions/upload-artifact@v4
        with:
          name: kindling-bin
          path: target/release/kindling
          retention-days: 1
          if-no-files-found: error

  test:
    name: cargo test (informational)
    # informational: runs beside the sims and never blocks them or the summary
    # (the whole suite passes on main as of v0.6.0)
    needs: plan
    if: inputs.run_tests
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 45
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false

      - name: Install Rust (stable)
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-test-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-test-${{ runner.os }}-

      - name: Test
        run: cargo test --release --locked --workspace

  sim:
    name: Seeds ${{ matrix.name }}
    needs: [plan, build]
    runs-on: ${{ inputs.runner }}
    timeout-minutes: ${{ fromJSON(inputs.sim_timeout || '150') }}
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      SEED_FROM: ${{ matrix.from }}
      SEED_TO: ${{ matrix.to }}
      CHUNK: ${{ matrix.name }}
      YEARS: ${{ inputs.years }}
      MAP: ${{ inputs.map }}
      CONFIG: ${{ inputs.config }}
      SAVE_CIVSAVE: ${{ inputs.save_civsave }}
      SCREENSHOTS: ${{ inputs.screenshots }}
      REPORT: ${{ inputs.report }}
    steps:
      - uses: actions/checkout@v4
        if: inputs.config != ''
        with:
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false

      - uses: actions/download-artifact@v4
        with:
          name: kindling-bin
          path: bin

      - name: Run headless sims
        run: |
          set -euo pipefail
          chmod +x bin/kindling
          mkdir -p out
          extra=(--years "$YEARS" --threads "$SIM_THREADS" --out out/data)
          if [ -n "$MAP" ]; then extra+=(--map "$MAP"); fi
          if [ -n "$REPORT" ]; then extra+=(--report "$REPORT"); fi
          if [ -n "$CONFIG" ]; then
            if [ ! -f "$CONFIG" ]; then echo "::error::config file '$CONFIG' not found in the repo"; exit 1; fi
            extra+=(--config "$CONFIG")
          fi
          res="out/results-${CHUNK}.txt"
          if [ "$SAVE_CIVSAVE" = "true" ]; then
            # --save overwrites after every seed, so run one process per seed.
            : > "$res"
            for s in $(seq "$SEED_FROM" "$SEED_TO"); do
              bin/kindling --headless --seed "$s" "${extra[@]}" --save "out/seed-${s}.civsave" \
                2> >(tee -a "out/stderr-${CHUNK}.txt" >&2) | tee -a "$res"
            done
          else
            bin/kindling --headless --seeds "${SEED_FROM}..${SEED_TO}" "${extra[@]}" \
              2> >(tee "out/stderr-${CHUNK}.txt" >&2) | tee "$res"
          fi

      - name: Render screenshots (Xvfb)
        if: inputs.screenshots
        run: |
          set -euo pipefail
          if ! command -v xvfb-run >/dev/null; then
            sudo apt-get update -q && sudo apt-get install -y -q xvfb libgl1-mesa-dri
          fi
          extra=(--years "$YEARS" --threads "$SIM_THREADS")
          if [ -n "$MAP" ]; then extra+=(--map "$MAP"); fi
          if [ -n "$CONFIG" ]; then extra+=(--config "$CONFIG"); fi
          for s in $(seq "$SEED_FROM" "$SEED_TO"); do
            xvfb-run -a -s "-screen 0 1400x860x24" \
              bin/kindling --seed "$s" --screenshot "out/screenshot-seed${s}.png" "${extra[@]}" \
              || echo "::warning::screenshot for seed $s failed"
          done

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results-${{ matrix.name }}
          path: |
            out/*.txt
            out/*.png
            out/*.civsave
            out/data/**
          retention-days: 30
          if-no-files-found: warn

  probe:
    # read-only instrumentation: watches the same worlds as the sim job (same seeds and map,
    # default params) and writes per-item spread / forgetting tables; uploaded as
    # results-probe-<chunk>, so the archive keeps them under jobs/
    name: Probe ${{ matrix.name }}
    needs: plan
    if: inputs.probe
    runs-on: ${{ inputs.runner }}
    timeout-minutes: ${{ fromJSON(inputs.sim_timeout || '150') }}
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false

      - name: Install Rust (stable)
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-test-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-test-${{ runner.os }}-

      - name: Run probe
        env:
          FROM: ${{ matrix.from }}
          TO: ${{ matrix.to }}
          CHUNK: ${{ matrix.name }}
          PROBE_YEARS: ${{ inputs.years }}
          MAP: ${{ inputs.map }}
          CONFIG: ${{ inputs.config }}
          RAYON_NUM_THREADS: ${{ inputs.threads || '4' }}
        run: |
          set -euo pipefail
          if [ -n "${CONFIG:-}" ]; then echo "::warning::the probe uses default params"; fi
          wh="${MAP:-256x160}"
          export PROBE_W="${wh%x*}" PROBE_H="${wh#*x}" PROBE_OUT="$PWD/probe-out"
          export PROBE_SEEDS=$(seq -s, "$FROM" "$TO")
          mkdir -p probe-out
          cargo test --release --locked -p civ-core probe_diffusion -- --ignored --nocapture 2>&1 | tee "probe-out/probe-${CHUNK}.log"
          gzip -9 probe-out/*.csv

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results-probe-${{ matrix.name }}
          path: probe-out/
          retention-days: 30
          if-no-files-found: warn

  summary:
    name: Summarise results
    needs: [plan, sim]
    if: always() && needs.plan.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false
          sparse-checkout: |
            tools
            docs

      - uses: actions/download-artifact@v4
        with:
          pattern: results-*
          path: artifacts

      - name: Combine and summarise
        env:
          SEEDS: ${{ inputs.seeds }}
          YEARS: ${{ inputs.years }}
          MAP: ${{ inputs.map }}
          CONFIG: ${{ inputs.config }}
          SIM_RESULT: ${{ needs.sim.result }}
          SHA: ${{ needs.plan.outputs.sha }}
          BASELINE: ${{ inputs.baseline }}
        run: |
          set -uo pipefail
          mkdir -p combined
          # Concatenate per-job results in seed order (tools/sum_results.py takes one file).
          find artifacts -name 'results-*.txt' | sort -t- -k2,2n | xargs -r cat > combined/results-all.txt
          {
            echo "## Kindling headless sims"
            echo
            echo "commit \`${SHA}\`, threads ${SIM_THREADS}, seeds \`${SEEDS}\`, years \`${YEARS}\`, map \`${MAP:-default}\`, config \`${CONFIG:-defaults}\`, sim jobs: ${SIM_RESULT}"
            echo
            echo "seeds reported: $(grep -c '^seed [0-9]*: Y' combined/results-all.txt || true)"
            echo
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -s combined/results-all.txt ] && python3 tools/sum_results.py combined/results-all.txt > combined/summary.txt 2> combined/summary.err; then
            cat combined/summary.txt >> "$GITHUB_STEP_SUMMARY"
          else
            echo "sum_results.py failed or no results; per-seed headline lines instead:" >> "$GITHUB_STEP_SUMMARY"
            cat combined/summary.err >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
            grep '^seed [0-9]*: Y' combined/results-all.txt >> "$GITHUB_STEP_SUMMARY" || true
          fi
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat combined/summary.txt 2>/dev/null || true
          # Cross-seed aggregates that work for any seeds_per_job (sum_results.py relies on the
          # aggregate lines a multi-seed process prints), side by side with the baseline.
          base=()
          if [ -n "$BASELINE" ] && [ -f "$BASELINE" ]; then base=("$BASELINE"); fi
          # structured outputs (data schema v1) when the sims wrote them; text report otherwise
          src=combined/results-all.txt
          if find artifacts -path '*/data/seed-*/summary.json' | grep -q .; then
            mkdir -p combined/data
            for d in $(find artifacts -type d -path '*/data/seed-*'); do cp -r "$d" combined/data/; done
            if python3 tools/collect_runs.py combined/data combined > combined/collect.txt 2>&1; then
              src=combined/data
              { echo; echo "### Runs (structured outputs)"; echo; echo '```'; cat combined/collect.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
            fi
            cat combined/collect.txt
          fi
          if python3 tools/agg_results.py "$src" "${base[@]}" > combined/aggregate.md 2> combined/aggregate.err; then
            { echo; echo "### Aggregate${base:+ vs $BASELINE}"; echo; cat combined/aggregate.md; } >> "$GITHUB_STEP_SUMMARY"
          fi
          cat combined/aggregate.md combined/aggregate.err 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        with:
          name: summary
          path: combined/
          retention-days: 30

  archive:
    # One strongly compressed archive of everything the run produced, kept as an asset of a
    # public pre-release `run-<run id>` (tag on the tested commit). Never marked latest; the
    # version releases (v0.x) are not touched. Only this job may write to the repository.
    name: Archive to pre-release
    needs: [plan, sim, summary, probe]
    if: always() && needs.plan.result == 'success' && inputs.archive
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      SHA: ${{ needs.plan.outputs.sha }}
      TAG: run-${{ github.run_id }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      ARCHIVE_SAVES: ${{ inputs.archive_saves }}
      SIM_RESULT: ${{ needs.sim.result }}
      INPUTS_JSON: ${{ toJSON(inputs) }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: results-*
          path: artifacts

      - uses: actions/download-artifact@v4
        with:
          name: summary
          path: artifacts/summary
        continue-on-error: true

      - name: Build archive
        run: |
          set -euo pipefail
          command -v zstd >/dev/null || { sudo apt-get update -q && sudo apt-get install -y -q zstd; }
          name="kindling-${TAG}"
          mkdir -p "stage/${name}"
          # per-seed jobs: reports, stderr, structured outputs (--out), screenshots, saves
          for d in artifacts/results-*; do
            [ -d "$d" ] || continue
            dst="stage/${name}/jobs/$(basename "$d")"
            mkdir -p "$dst"
            if [ "$ARCHIVE_SAVES" = "true" ]; then
              cp -r "$d"/. "$dst"/
            else
              tar -C "$d" --exclude='*.civsave' -cf - . | tar -C "$dst" -xf -
            fi
          done
          # the combined summary (its data/ is a copy of the per-seed outputs above)
          if [ -d artifacts/summary ]; then
            mkdir -p "stage/${name}/summary"
            tar -C artifacts/summary --exclude='./data' -cf - . | tar -C "stage/${name}/summary" -xf -
          fi
          started=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" -q .run_started_at || echo "")
          ended=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          STARTED="$started" ENDED="$ended" NAME="$name" python3 - <<'PY'
          import json, os
          root = os.path.join("stage", os.environ["NAME"])
          inputs = json.loads(os.environ["INPUTS_JSON"])
          files = []
          for dp, _, fs in os.walk(root):
              for f in sorted(fs):
                  p = os.path.join(dp, f)
                  files.append({"path": os.path.relpath(p, root), "bytes": os.path.getsize(p)})
          files.sort(key=lambda x: x["path"])
          seeds = sorted({int(x["path"].split("seed-")[1].split("/")[0].split(".")[0])
                          for x in files if "/seed-" in x["path"] and x["path"].split("seed-")[1][:1].isdigit()})
          m = {
              "kind": "kindling-ci-run-archive",
              "run_id": int(os.environ["GITHUB_RUN_ID"]),
              "run_attempt": int(os.environ.get("GITHUB_RUN_ATTEMPT", "1")),
              "run_url": os.environ["RUN_URL"],
              "repository": os.environ["GITHUB_REPOSITORY"],
              "ref_sha": os.environ["SHA"],
              "workflow": os.environ.get("GITHUB_WORKFLOW"),
              "inputs": inputs,
              "seeds": seeds,
              "map": inputs.get("map") or "256x160 (default)",
              "years": inputs.get("years"),
              "sim_jobs": os.environ["SIM_RESULT"],
              "saves_included": os.environ["ARCHIVE_SAVES"] == "true",
              "started_at": os.environ["STARTED"] or None,
              "archived_at": os.environ["ENDED"],
              "total_bytes": sum(x["bytes"] for x in files),
              "files": files,
          }
          json.dump(m, open(os.path.join(root, "run-manifest.json"), "w"), indent=1)
          print(f"{len(files)} files, {m['total_bytes']/1e6:.1f} MB, seeds {seeds}")
          PY
          tar -C stage -cf - "$name" | zstd -19 -T0 --long=27 -q -o "${name}.tar.zst"
          raw=$(du -sb "stage/${name}" | cut -f1)
          packed=$(stat -c %s "${name}.tar.zst")
          echo "archive ${name}.tar.zst: ${packed} bytes from ${raw} (ratio $(python3 -c "print(round(${raw}/${packed},2))"))" | tee -a "$GITHUB_STEP_SUMMARY"
          mkdir -p assets
          cp "stage/${name}/run-manifest.json" "assets/${name}-manifest.json"
          # release assets are limited to 2 GiB: split bigger archives (cat the parts to rejoin)
          if [ "$packed" -gt 2000000000 ]; then
            split -b 1900M -d -a 2 "${name}.tar.zst" "assets/${name}.tar.zst.part"
            rm "${name}.tar.zst"
          else
            mv "${name}.tar.zst" assets/
          fi
          (cd assets && sha256sum * > "${name}.sha256")
          ls -l assets
          echo "RAW_BYTES=${raw}" >> "$GITHUB_ENV"
          echo "PACKED_BYTES=${packed}" >> "$GITHUB_ENV"

      - name: Publish pre-release
        run: |
          set -euo pipefail
          inp=$(python3 -c "import json,os; print('\n'.join(f'- {k}: \`{str(v).lower() if isinstance(v, bool) else v}\`' for k, v in json.loads(os.environ['INPUTS_JSON']).items()))")
          cat > notes.md <<EOF
          Archived outputs of headless-sims run [${GITHUB_RUN_ID}](${RUN_URL}) on \`${SHA}\` (sim jobs: ${SIM_RESULT}).
          Not a Kindling release.

          Archive: $(python3 -c "print(f'{${PACKED_BYTES}/1e6:.1f} MB zstd -19 of {${RAW_BYTES}/1e6:.1f} MB')"); \`gh release download ${TAG} -R ${GITHUB_REPOSITORY}\`, see docs/CI-ARCHIVES.md.

          Inputs:
          ${inp}
          EOF
          sed -i 's/^          //' notes.md
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" assets/* --clobber -R "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" assets/* -R "$GITHUB_REPOSITORY" --target "$SHA" --prerelease --latest=false \
              --title "CI run ${GITHUB_RUN_ID}: seeds ${{ inputs.seeds }}, ${{ inputs.years }} y, map ${{ inputs.map || 'default' }}" \
              --notes-file notes.md
          fi
          echo "release: ${{ github.server_url }}/${GITHUB_REPOSITORY}/releases/tag/${TAG}" | tee -a "$GITHUB_STEP_SUMMARY"
